# ==============================================================================
# Nginx Location 匹配优先级靶场实验配置
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name localhost;

        # 1. 精确匹配 (=)：优先级最高
        location = /login {
            return 200 "MATCH: Exact /login\n";
        }

        # 2. 前缀强匹配 (^~)：命中后直接生效，绝不继续尝试后面的正则表达式！
        location ^~ /api/admin/ {
            # 模拟防御拦截：严禁外网访问管理接口
            return 403 "BLOCKED: Forbidden Admin Access\n";
        }

        # 3. 正则匹配 (~)：区分大小写
        location ~ \.php$ {
            return 200 "MATCH: Regex PHP Handler\n";
        }

        # 4. 普通前缀匹配：无任何修饰符，会被后续正则无情截胡
        location /static/ {
            return 200 "MATCH: Normal Prefix Static\n";
        }

        # 5. 默认根路由
        location / {
            return 200 "MATCH: Default Root\n";
        }
    }
}
